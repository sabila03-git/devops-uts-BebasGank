name: CI/CD Pipeline - DevOps UTS

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  build-and-test:
    name: Build dan Test Aplikasi
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install --if-present

      - name: Run Unit Tests
        run: npm test

      - name: Build Success
        run: echo "CI - Test berhasil!"

  build-and-deploy:
    name: Build Docker dan Deploy ke Staging
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Login ke Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          ls -la
          docker build -f Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/devops-uts-app:latest .
          docker build -f Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/devops-uts-app:${{ github.sha }} .

      - name: Push ke Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/devops-uts-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/devops-uts-app:${{ github.sha }}

      - name: Deploy ke Staging
        run: |
          echo "Deploying ke staging environment..."
          echo "Image: ${{ secrets.DOCKER_USERNAME }}/devops-uts-app:latest"
          echo "Commit: ${{ github.sha }}"
          echo "Deployment ke staging berhasil!"