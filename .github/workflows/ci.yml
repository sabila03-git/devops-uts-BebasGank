name: CI/CD Pipeline - DevOps UTS

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  build-and-test:
    name: Build dan Test Aplikasi
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install --if-present

      - name: Run Unit Tests
        run: npm test

      - name: Build Success
        run: echo "CI - Test berhasil!"

  build-and-deploy:
    name: Build Docker dan Deploy ke Staging
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login ke Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          echo "Isi direktori:"
          ls -la
          echo "Build image..."
          docker build -t ${{ secrets.DOCKER_USERNAME }}/devops-uts-app:latest .

      - name: Push ke Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/devops-uts-app:latest

      - name: Deploy ke Staging
        run: |
          echo "Deploying ke staging..."
          echo "Image: ${{ secrets.DOCKER_USERNAME }}/devops-uts-app:latest"
          echo "Deployment berhasil!"