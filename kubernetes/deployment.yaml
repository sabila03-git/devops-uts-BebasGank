# kubernetes/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-uts-app
  labels:
    app: devops-uts-app
    version: "1.0"
    env: staging
spec:
  # Jalankan 2 replica container (high availability)
  replicas: 2
  
  # Selector untuk memilih Pod yang dikelola Deployment ini
  selector:
    matchLabels:
      app: devops-uts-app
  
  # Template Pod
  template:
    metadata:
      labels:
        app: devops-uts-app
    spec:
      containers:
        - name: devops-uts-app
          # Ganti dengan image dari Docker Hub kamu
          image: [dockerhub-username]/devops-uts-app:latest
          imagePullPolicy: Always
          
          ports:
            - containerPort: 3000
          
          # Environment variables
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
          
          # Resource limits (penting untuk production)
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          
          # Health check - Kubernetes akan restart container kalau ini gagal
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
  
  # Strategi update (RollingUpdate = update bertahap, tidak ada downtime)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0